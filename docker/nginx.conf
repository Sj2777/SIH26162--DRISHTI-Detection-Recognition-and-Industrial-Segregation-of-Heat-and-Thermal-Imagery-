worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    server {
        listen ${PORT};
        server_name _;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /industry {
            return 301 /industry/;
        }

        location ^~ /industry/ {
            alias /app/industrial-portal/frontend/dist/;
            try_files $uri $uri/ /industry/index.html;
        }

        location /industry-api/ {
            proxy_pass http://127.0.0.1:5000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /municipal {
            return 301 /municipal/;
        }

        location ^~ /municipal/ {
            proxy_pass http://127.0.0.1:5193;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # The context service receives the path with /api/context/ stripped.
        location /api/context/ {
            proxy_pass http://127.0.0.1:5176/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # The Prithvi service exposes health at /health, outside its API prefix.
        location = /api/prithvi/health {
            proxy_pass http://127.0.0.1:5178/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Match Vite's /api/prithvi -> /prithvi rewrite.
        location /api/prithvi {
            proxy_pass http://127.0.0.1:5178/prithvi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Sentinel-3 and SEVIRI retain their incoming API prefixes.
        location /api/sentinel3/ {
            proxy_pass http://127.0.0.1:5175;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/seviri/ {
            proxy_pass http://127.0.0.1:5174;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Vite proxy targets and rewrites, reproduced from vite.config.js.
        location = /api/firms/noaa20/24h {
            proxy_pass https://firms.modaps.eosdis.nasa.gov/data/active_fire/noaa-20-viirs-c2/csv/J1_VIIRS_C2_South_Asia_24h.csv;
            proxy_ssl_server_name on;
            proxy_set_header Host firms.modaps.eosdis.nasa.gov;
        }

        location = /api/firms/noaa20/7d {
            proxy_pass https://firms.modaps.eosdis.nasa.gov/data/active_fire/noaa-20-viirs-c2/csv/J1_VIIRS_C2_South_Asia_7d.csv;
            proxy_ssl_server_name on;
            proxy_set_header Host firms.modaps.eosdis.nasa.gov;
        }

        location = /api/firms/noaa21/24h {
            proxy_pass https://firms.modaps.eosdis.nasa.gov/data/active_fire/noaa-21-viirs-c2/csv/J2_VIIRS_C2_South_Asia_24h.csv;
            proxy_ssl_server_name on;
            proxy_set_header Host firms.modaps.eosdis.nasa.gov;
        }

        location = /api/firms/noaa21/7d {
            proxy_pass https://firms.modaps.eosdis.nasa.gov/data/active_fire/noaa-21-viirs-c2/csv/J2_VIIRS_C2_South_Asia_7d.csv;
            proxy_ssl_server_name on;
            proxy_set_header Host firms.modaps.eosdis.nasa.gov;
        }

        location = /api/firms/snpp/24h {
            proxy_pass https://firms.modaps.eosdis.nasa.gov/data/active_fire/suomi-npp-viirs-c2/csv/SUOMI_VIIRS_C2_South_Asia_24h.csv;
            proxy_ssl_server_name on;
            proxy_set_header Host firms.modaps.eosdis.nasa.gov;
        }

        location = /api/firms/snpp/7d {
            proxy_pass https://firms.modaps.eosdis.nasa.gov/data/active_fire/suomi-npp-viirs-c2/csv/SUOMI_VIIRS_C2_South_Asia_7d.csv;
            proxy_ssl_server_name on;
            proxy_set_header Host firms.modaps.eosdis.nasa.gov;
        }

        location = /api/firms/modis-terra/24h {
            proxy_pass https://firms.modaps.eosdis.nasa.gov/data/active_fire/modis-c6.1/csv/MODIS_C6_1_South_Asia_24h.csv;
            proxy_ssl_server_name on;
            proxy_set_header Host firms.modaps.eosdis.nasa.gov;
        }

        location = /api/firms/modis-terra/7d {
            proxy_pass https://firms.modaps.eosdis.nasa.gov/data/active_fire/modis-c6.1/csv/MODIS_C6_1_South_Asia_7d.csv;
            proxy_ssl_server_name on;
            proxy_set_header Host firms.modaps.eosdis.nasa.gov;
        }

        location = /api/nasa-firms-noaa20 {
            proxy_pass https://firms.modaps.eosdis.nasa.gov/data/active_fire/noaa-20-viirs-c2/csv/J1_VIIRS_C2_South_Asia_24h.csv;
            proxy_ssl_server_name on;
            proxy_set_header Host firms.modaps.eosdis.nasa.gov;
        }

        location = /api/nasa-firms-snpp {
            proxy_pass https://firms.modaps.eosdis.nasa.gov/data/active_fire/suomi-npp-viirs-c2/csv/SUOMI_VIIRS_C2_South_Asia_24h.csv;
            proxy_ssl_server_name on;
            proxy_set_header Host firms.modaps.eosdis.nasa.gov;
        }

        location = /api/weather {
            rewrite ^ /v1/forecast break;
            proxy_pass https://api.open-meteo.com;
            proxy_ssl_server_name on;
            proxy_set_header Host api.open-meteo.com;
        }

        location ^~ /api/weather/ {
            rewrite ^/api/weather(.*)$ /v1/forecast$1 break;
            proxy_pass https://api.open-meteo.com;
            proxy_ssl_server_name on;
            proxy_set_header Host api.open-meteo.com;
        }

        # Serve files written at runtime by EUMDAC services without rebuilding.
        location = /data {
            return 301 /data/;
        }

        location ^~ /data/ {
            alias /app/public/data/;
            autoindex off;
        }

        location / {
            root /app/dist;
            try_files $uri $uri/ /index.html;
        }
    }
}